# semantic-evidence-engine-release: v1.1.20
name: Build desktop executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auditor_bola/**"
      - "aegis_auditor.py"
      - "AegisAuditor.spec"
      - "requirements-runtime.txt"
      - "requirements-build.txt"
      - "scripts/generate_app_icons.py"
      - "installer/**"
      - "assets/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir ejecutable
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Construir instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\AegisAuditor.iss
      - name: Preparar artefactos de release
        shell: pwsh
        run: |
          Copy-Item dist\AegisAuditor.exe dist\AegisAuditor-Windows-x64.exe
          Copy-Item dist\AegisAuditor-Setup.exe dist\AegisAuditor-Windows-x64-Setup.exe
          (Get-FileHash dist\AegisAuditor-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64.exe.sha256
          (Get-FileHash dist\AegisAuditor-Windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64-Setup.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Windows-x64
          path: |
            dist/AegisAuditor-Windows-x64.exe
            dist/AegisAuditor-Windows-x64-Setup.exe
            dist/AegisAuditor-Windows-x64*.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir aplicación
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Firma ad-hoc
        run: codesign --force --deep --sign - dist/AegisAuditor.app
      - name: Crear DMG y ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R dist/AegisAuditor.app dmg-root/
          cp LICENSE NOTICE dmg-root/

          dmg="dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg"
          zip="dist/AegisAuditor-macOS-${{ matrix.arch }}.zip"

          # GitHub macOS runners pueden dejar diskimages-helper ocupado unos
          # segundos después del codesign. Limpiamos cualquier montaje previo
          # y reintentamos la creación del DMG en vez de fallar el release por
          # un "Resource busy" transitorio.
          created=0
          for attempt in 1 2 3 4; do
            rm -f "$dmg"
            hdiutil detach "/Volumes/Aegis Auditor" -force >/dev/null 2>&1 || true
            sync
            if hdiutil create               -volname "Aegis Auditor"               -srcfolder dmg-root               -ov               -format UDZO               "$dmg"; then
              created=1
              break
            fi

            echo "hdiutil falló en intento $attempt/4; reintentando..."
            sleep $((attempt * 3))
          done

          if [ "$created" -ne 1 ] || [ ! -s "$dmg" ]; then
            echo "No fue posible crear un DMG válido después de 4 intentos."
            exit 1
          fi

          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent             dist/AegisAuditor.app "$zip"

          shasum -a 256 "$dmg" > "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
          shasum -a 256 "$zip" >> "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-macOS-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg
            dist/AegisAuditor-macOS-${{ matrix.arch }}.zip
            dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Librerías de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libegl1 libgl1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir binario
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Empaquetar TAR.GZ
        shell: bash
        run: |
          chmod +x dist/AegisAuditor
          mkdir -p package
          cp dist/AegisAuditor package/
          cp docs/REQUISITOS_APLICACION.md package/REQUISITOS.md
          cp LICENSE NOTICE package/
          tar -C package -czf "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" .
      - name: Construir DEB
        shell: bash
        run: |
          root="debroot"
          mkdir -p "$root/DEBIAN" "$root/usr/local/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps" "$root/usr/share/doc/aegis-auditor"
          cp dist/AegisAuditor "$root/usr/local/bin/AegisAuditor"
          cp LICENSE "$root/usr/share/doc/aegis-auditor/LICENSE"
          cp NOTICE "$root/usr/share/doc/aegis-auditor/NOTICE"
          chmod 755 "$root/usr/local/bin/AegisAuditor"
          cp assets/aegis-auditor.png "$root/usr/share/icons/hicolor/256x256/apps/aegis-auditor.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Aegis Auditor' \
            'Comment=Security Remediation Studio' \
            'Exec=/usr/local/bin/AegisAuditor' \
            'Icon=aegis-auditor' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Development;Security;' \
            > "$root/usr/share/applications/aegis-auditor.desktop"
          printf '%s\n' \
            'Package: aegis-auditor' \
            'Version: 1.1.20' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: ${{ matrix.deb_arch }}' \
            'Maintainer: Aegis Auditor Project' \
            'Depends: libc6, libx11-6, libxext6, libxrender1, libxft2, libfontconfig1, libegl1, libgl1, libdbus-1-3, libxcb-cursor0, libxkbcommon-x11-0' \
            'Description: Aegis Auditor - Security Remediation Studio' \
            ' Auditor correctivo multitecnologia basado en Pilar 1 y Pilar 2.' \
            > "$root/DEBIAN/control"
          dpkg-deb --build "$root" "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb"
      - name: Preparar binario y checksums
        shell: bash
        run: |
          cp "dist/AegisAuditor" "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          chmod +x "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}" > "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Linux-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-Linux-${{ matrix.arch }}
            dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz
            dist/AegisAuditor-Linux-${{ matrix.arch }}.deb
            dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256
          if-no-files-found: error


  release-v1-1-20:
    name: Publicar Release v1.1.20
    needs:
      - windows-x64
      - macos
      - linux
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v1.1.20]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los empaquetados
        uses: actions/download-artifact@v4
        with:
          pattern: Aegis-Auditor-*
          path: release-assets
          merge-multiple: true

      - name: Preparar notas de versión
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Aegis Auditor v1.1.20

          Nueva versión de **Aegis Auditor — Security Remediation Studio**.

          ## Novedades de v1.1.20
          - Corrige la versión de la aplicación analizada: ya no se asigna
            `1.0.0` por defecto.
          - Detecta la versión real desde package.json, pom.xml, Gradle,
            pyproject.toml, Cargo.toml, composer.json, pubspec.yaml, csproj,
            mix.exs, version.php, MANIFEST.MF y archivos VERSION.
          - También reconoce APP_VERSION, APPLICATION_VERSION,
            PROJECT_VERSION, __version__, info.app.version y documentación
            cuando no existe un manifest más confiable.
          - El perfil guarda `version_detectada`, `version_fuente`,
            `version_confianza` y todas las `version_candidatas`.
          - Si no existe una versión verificable se usa `desconocida`,
            nunca una versión inventada.
          - Se mantienen el escaneo de documentación, cuentas, endpoints,
            fullscreen, progreso, botón Salir y Apache License 2.0.
          - El inicio de aplicaciones ahora selecciona la primera estrategia de runtime realmente ejecutable.
          - Los perfiles Docker conservan alternativas nativas cuando Docker no está instalado o no está en PATH.
          - El auditor evita ejecutar comandos de detención si el arranque falló.
          - La URL base se asocia a la estrategia de runtime seleccionada.
          - Los perfiles antiguos se enriquecen automáticamente con fallbacks de runtime detectados.
          - Los diálogos secundarios y selectores de archivos Qt adoptan el diseño oscuro y maximizado de Aegis.
          - La auditoría P1 + P2 ahora muestra progreso real por control, etapa y total procesado.
          - Se elimina la sensación de bloqueo en porcentajes estimados como 42% durante diagnósticos largos.
          - La barra y el modal reciben el avance del motor en segundo plano sin congelar la interfaz.
          - La fase de inicio del objetivo muestra ahora el progreso real del runtime: selección, preparación, lanzamiento y estabilización.
          - Se corrige el bloqueo visual en 92% durante el inicio de la aplicación objetivo.
          - Antes de levantar cualquier objetivo, Aegis limpia instancias anteriores que hayan quedado activas por un cierre forzado.
          - En runtimes de servicio ejecuta primero el comando de parada; en procesos locales libera el puerto objetivo y termina el árbol huérfano cuando corresponde.
          - La limpieza previa se registra en la consola para indicar si se detuvo un servicio, se cerraron procesos huérfanos o el puerto ya estaba libre.
          - Antes de cualquier nuevo arranque, Aegis busca y termina todos los procesos anteriores asociados al mismo proyecto objetivo, no solo el proceso que ocupa el puerto.
          - La detección se limita al proyecto cargado y a sus rutas/comandos para no cerrar procesos ajenos del sistema.
          - La IA puede configurarse directamente dentro de Aegis; OpenCode deja de ser un requisito para usar el asistente en otro PC.
          - Se admite configuración persistente propia de Aegis, variables AEGIS_AI_* e importación opcional desde OpenCode.
          - La barra de progreso ya puede mostrar el 100% real durante el arranque y no queda retenida visualmente en 99%.
          - Aegis conserva temporalmente el PID del objetivo para recuperar y cerrar procesos que sobrevivan a un cierre forzado del auditor.
          - Aegis ahora administra múltiples perfiles IA y permite crear, editar, duplicar, eliminar y seleccionar el proveedor activo desde Configuración.
          - Cada perfil IA conserva nombre, URL base, modelo y su clave local; cambiar de perfil no obliga a reescribir los demás proveedores.
          - La configuración IA antigua de un solo proveedor se migra automáticamente al nuevo formato de perfiles.
          - OpenCode puede importarse como un perfil adicional y deja de ser una dependencia para seleccionar proveedores ya guardados en Aegis.
          - En Windows, los runtimes objetivo y comandos auxiliares se ejecutan ocultos con CREATE_NO_WINDOW para evitar dejar una ventana CMD/PowerShell negra abierta.
          - La salida del proceso objetivo sigue capturándose en la consola interna de Aegis aunque la consola externa quede oculta.
          - Docker deja de ser obligatorio: si no está instalado o no levanta el servidor, Aegis intenta automáticamente un runtime local ejecutable del proyecto.
          - El perfil JSON expone preferencia_arranque, permitir_fallback_local, comandos, URL y alternativas, y mantiene metadata_detectada.plan_ejecucion sincronizado.
          - En proyectos Python, Aegis prioriza .venv/venv/env del proyecto antes de buscar Python del sistema.
          - La pantalla de Inicio muestra el comando de ejecución, política de arranque y alternativas locales configuradas.
          - Los workflows CI y la interfaz profesional fueron validados después de las correcciones del arranque local y la detección de puertos.
          - El empaquetado macOS reintenta automáticamente la creación del DMG cuando el runner devuelve un error transitorio "Resource busy".
          - El arranque local detecta la URL/puerto que el propio servidor anuncia y corrige automáticamente una base_url estimada incorrecta.
          - Si Docker no está instalado, Aegis descarta esa estrategia y selecciona el mejor runtime local disponible según el equipo.
          - Si el servidor Python anuncia 127.0.0.1:5050 aunque el perfil estimara 5000, Aegis adopta 5050 y continúa sin marcar un falso fallo de inicio.
          - El backend reserva 100% para la finalización real del Worker; el motor de arranque se queda en 99% hasta devolver control a la interfaz.
          - Los Worker de Qt se mantienen referenciados hasta finished/error para evitar perder la señal final y dejar el modal pegado en 100%.
          - La URL real del runtime local seleccionado se guarda nuevamente en el perfil JSON para próximos arranques.
          - La base_url del JSON de config es la autoridad para la IP y el puerto permitidos del objetivo, sin importar si Aegis usa Docker, Python u otra estrategia.
          - Al caer de Docker a Python, Aegis sincroniza la alternativa local con la IP/puerto declarados en config en vez de conservar un puerto estimado distinto.
          - La detección del runtime puede elegir cómo arrancar la aplicación, pero no puede modificar una base_url ya declarada por el perfil.
          - Al generar el JSON, Aegis comprueba si Docker está instalado en el equipo actual; sin Docker, selecciona directamente el runtime local como principal.
          - El perfil registra metadata_detectada.entorno_ejecucion con docker_instalado y el runtime principal elegido.
          - Las pruebas CI fueron actualizadas para la verificación real de disponibilidad de servicios.
          - El diagnóstico ya no puede devolver '0 hallazgos' cuando el perfil contiene 0 controles activos; ahora informa que no se ejecutó ninguna prueba de seguridad.
          - El auto-perfil infiere controles P2 de alta confianza para reflexión CORS, secretos con valor por defecto y usuario efectivo de Docker.
          - Los perfiles antiguos con cero controles se enriquecen automáticamente al volver a cargar el código fuente, sin borrar controles manuales existentes.
          - El perfil JSON incorpora `chequeos_pilar1` como registro canónico de BOLA, RBAC/ABAC y alcance de agentes, manteniendo compatibilidad con `endpoints`, `chequeos_acceso` y `chequeos_agente`.
          - Aegis reconstruye controles ejecutables del Pilar 1 desde tests, fixtures, datos semilla y archivos de soporte cuando encuentra evidencia suficiente de propietario, rol esperado o alcance del agente.
          - Las rutas Flask Blueprint conservan `url_prefix` y ya no se duplican erróneamente como rutas JavaScript.
          - El diagnóstico completo desde la GUI exige cobertura activa en Pilar 1 y Pilar 2; los flujos internos de verificación/corrección siguen admitiendo controles dirigidos de un solo pilar.
          - La pantalla de Inicio muestra el runtime realmente seleccionado en esta ejecución (por ejemplo Python/process) en vez del runtime principal antiguo del perfil.
          - Los perfiles auto-generados heredados que aún tenían Docker Compose como principal se migran al runtime local detectado cuando Docker no está disponible.
          - La Base URL mostrada en Inicio se toma del runtime activo y queda alineada con la URL local realmente utilizada.
          - Antes de iniciar Diagnosticar P1 + P2, Aegis valida cobertura ejecutable de ambos pilares y bloquea la ejecución incompleta antes de abrir el progreso.
          - Se mejora la detección de URL/puerto del runtime Python a partir de launchers y configuración local, sin usar el mapeo Docker como autoridad del runtime nativo.
          - Se filtran candidatos de cuentas falsos extraídos de texto o código que no cumplen el formato de un username válido.
          - Aegis puede convertir candidatos BOLA del Pilar 1 en controles ejecutables usando evidencia de solo lectura del objetivo ya iniciado.
          - El resolvedor P1 consulta colecciones autenticadas con GET, identifica pares objeto-propietario y persiste los controles resueltos en `chequeos_pilar1`.
          - El descubrimiento P1 en vivo no ejecuta PATCH, PUT ni DELETE para evitar modificar datos reales durante la auto-configuración.
          - Se añaden pruebas de regresión para resolución BOLA en vivo y para impedir inferencias cuando la API no expone propietario.
          - Se incorpora un motor semántico genérico para inferir identificadores y propiedad desde nombres de campo y estructuras anidadas, sin depender de términos propios de Tramitia.
          - La reconstrucción de BOLA usa aliases semánticos como id/uuid/code/codigo y owner/author/creator/created_by, incluyendo objetos anidados y parámetros de ruta de distintos frameworks.
          - Los contratos HTTP de tests se extraen de Python y JavaScript/TypeScript para reconstruir RBAC/ABAC y cuerpos de prueba con mayor cobertura.
          - RBAC/ABAC se deriva de tests de seguridad con identidad y status esperado aunque la ruta no contenga palabras como admin o audit.
          - La reconstrucción de Agent Scope deriva campos de steps/tool/count desde las aserciones del test, evitando nombres fijos como pasos/herramienta/devueltas.
          - Pilar 2 agrega controles source_regex y auto-detección de debug explícito, cookies de sesión Secure=false, secretos con fallback y posibles bypasses de límites/cuotas sin guardia de autorización.
          - Los candidatos P1 también se descubren por semántica de autorización en el código fuente, no solo por el nombre de la ruta.
          - El JSON registra metadata_detectada.motor_evidencia con fuentes, capacidades y política de confianza del motor semántico.

          ## Descargas

          ### Windows x64
          - `AegisAuditor-Windows-x64-Setup.exe`: instalador recomendado.
          - `AegisAuditor-Windows-x64.exe`: ejecutable portable.

          ### macOS
          - `AegisAuditor-macOS-arm64.dmg`: Apple Silicon (M1/M2/M3/M4).
          - `AegisAuditor-macOS-x64.dmg`: Intel.
          - Los ZIP contienen la aplicación `.app` correspondiente.

          ### Linux
          - `AegisAuditor-Linux-x64.deb`: Debian/Ubuntu x64.
          - `AegisAuditor-Linux-arm64.deb`: Debian/Ubuntu ARM64.
          - `*.tar.gz`: paquete portable.
          - `AegisAuditor-Linux-x64` y `AegisAuditor-Linux-arm64`: binarios directos.

          Cada plataforma incluye archivos SHA-256 para verificar la integridad.

          ## Licencia
          Aegis Auditor se distribuye bajo Apache License 2.0. Los archivos
          `LICENSE` y `NOTICE` acompañan el release y los paquetes instalables.

          > Los perfiles de aplicaciones no se distribuyen dentro del release. Aegis genera o carga los perfiles desde la interfaz.
          EOF

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.zip|*.deb|*.tar.gz|*.sha256|*/AegisAuditor-Linux-x64|*/AegisAuditor-Linux-arm64)
                files+=("$file")
                ;;
            esac
          done < <(find release-assets -type f -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron artefactos para publicar."
            exit 1
          fi

          files+=("LICENSE" "NOTICE")

          if gh release view "v1.1.20" >/dev/null 2>&1; then
            gh release upload "v1.1.20" "${files[@]}" --clobber
            gh release edit "v1.1.20" \
              --title "Aegis Auditor v1.1.20" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "v1.1.20" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Aegis Auditor v1.1.20" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
