# matrix-policy-evaluation-release: v1.2.0
name: Build desktop executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auditor_bola/**"
      - "aegis_auditor.py"
      - "AegisAuditor.spec"
      - "requirements-runtime.txt"
      - "requirements-build.txt"
      - "scripts/generate_app_icons.py"
      - "installer/**"
      - "assets/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir ejecutable
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Construir instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\AegisAuditor.iss
      - name: Preparar artefactos de release
        shell: pwsh
        run: |
          Copy-Item dist\AegisAuditor.exe dist\AegisAuditor-Windows-x64.exe
          Copy-Item dist\AegisAuditor-Setup.exe dist\AegisAuditor-Windows-x64-Setup.exe
          (Get-FileHash dist\AegisAuditor-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64.exe.sha256
          (Get-FileHash dist\AegisAuditor-Windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64-Setup.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Windows-x64
          path: |
            dist/AegisAuditor-Windows-x64.exe
            dist/AegisAuditor-Windows-x64-Setup.exe
            dist/AegisAuditor-Windows-x64*.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir aplicación
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Firma ad-hoc
        run: codesign --force --deep --sign - dist/AegisAuditor.app
      - name: Crear DMG y ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R dist/AegisAuditor.app dmg-root/
          cp LICENSE NOTICE dmg-root/

          dmg="dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg"
          zip="dist/AegisAuditor-macOS-${{ matrix.arch }}.zip"

          # GitHub macOS runners pueden dejar diskimages-helper ocupado unos
          # segundos después del codesign. Limpiamos cualquier montaje previo
          # y reintentamos la creación del DMG en vez de fallar el release por
          # un "Resource busy" transitorio.
          created=0
          for attempt in 1 2 3 4; do
            rm -f "$dmg"
            hdiutil detach "/Volumes/Aegis Auditor" -force >/dev/null 2>&1 || true
            sync
            if hdiutil create               -volname "Aegis Auditor"               -srcfolder dmg-root               -ov               -format UDZO               "$dmg"; then
              created=1
              break
            fi

            echo "hdiutil falló en intento $attempt/4; reintentando..."
            sleep $((attempt * 3))
          done

          if [ "$created" -ne 1 ] || [ ! -s "$dmg" ]; then
            echo "No fue posible crear un DMG válido después de 4 intentos."
            exit 1
          fi

          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent             dist/AegisAuditor.app "$zip"

          shasum -a 256 "$dmg" > "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
          shasum -a 256 "$zip" >> "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-macOS-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg
            dist/AegisAuditor-macOS-${{ matrix.arch }}.zip
            dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Librerías de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libegl1 libgl1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir binario
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Empaquetar TAR.GZ
        shell: bash
        run: |
          chmod +x dist/AegisAuditor
          mkdir -p package
          cp dist/AegisAuditor package/
          cp docs/REQUISITOS_APLICACION.md package/REQUISITOS.md
          cp LICENSE NOTICE package/
          tar -C package -czf "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" .
      - name: Construir DEB
        shell: bash
        run: |
          root="debroot"
          mkdir -p "$root/DEBIAN" "$root/usr/local/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps" "$root/usr/share/doc/aegis-auditor"
          cp dist/AegisAuditor "$root/usr/local/bin/AegisAuditor"
          cp LICENSE "$root/usr/share/doc/aegis-auditor/LICENSE"
          cp NOTICE "$root/usr/share/doc/aegis-auditor/NOTICE"
          chmod 755 "$root/usr/local/bin/AegisAuditor"
          cp assets/aegis-auditor.png "$root/usr/share/icons/hicolor/256x256/apps/aegis-auditor.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Aegis Auditor' \
            'Comment=Security Remediation Studio' \
            'Exec=/usr/local/bin/AegisAuditor' \
            'Icon=aegis-auditor' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Development;Security;' \
            > "$root/usr/share/applications/aegis-auditor.desktop"
          printf '%s\n' \
            'Package: aegis-auditor' \
            'Version: 1.2.0' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: ${{ matrix.deb_arch }}' \
            'Maintainer: Aegis Auditor Project' \
            'Depends: libc6, libx11-6, libxext6, libxrender1, libxft2, libfontconfig1, libegl1, libgl1, libdbus-1-3, libxcb-cursor0, libxkbcommon-x11-0' \
            'Description: Aegis Auditor - Security Remediation Studio' \
            ' Auditor correctivo multitecnologia basado en Pilar 1 y Pilar 2.' \
            > "$root/DEBIAN/control"
          dpkg-deb --build "$root" "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb"
      - name: Preparar binario y checksums
        shell: bash
        run: |
          cp "dist/AegisAuditor" "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          chmod +x "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}" > "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Linux-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-Linux-${{ matrix.arch }}
            dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz
            dist/AegisAuditor-Linux-${{ matrix.arch }}.deb
            dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256
          if-no-files-found: error


  release-v1-2-0:
    name: Publicar Release v1.2.0
    needs:
      - windows-x64
      - macos
      - linux
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v1.2.0]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los empaquetados
        uses: actions/download-artifact@v4
        with:
          pattern: Aegis-Auditor-*
          path: release-assets
          merge-multiple: true

      - name: Preparar notas de versión
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Aegis Auditor v1.2.0

          Nueva versión de **Aegis Auditor — Security Remediation Studio**.

          ## Novedades principales

          - Nuevo motor de seguridad basado en evidencia y comportamiento, sin reglas específicas de una aplicación.
          - Construcción explícita del modelo **Identidad → Rol/Atributos → Endpoint → Acción → Recurso → Propiedad**.
          - Registro extensible de familias de controles para BOLA, RBAC/ABAC, Agent Scope, bypass de límites, CORS, secretos, contenedores, debug y sesión.
          - Estados diferenciados para candidato, evidencia insuficiente, por confirmar, prueba preparada, confirmado, descartado y no ejecutable.
          - Separación estructural **Hallazgo → Evidencias → Casos de prueba**.
          - IDs semánticos y estables generados dinámicamente; no dependen de IDs históricos de otros proyectos.
          - Deduplicación por familia, endpoint/componente, recurso y causa raíz para evitar contar varias pruebas como vulnerabilidades distintas.
          - Matriz **endpoint × identidad** enriquecida con forma de respuesta JSON, conteo de objetos, IDs observados y firma semántica.
          - Las diferencias entre respuestas de usuarios se conservan como evidencia y no se convierten por sí solas en vulnerabilidad.
          - POST/PUT/PATCH solo se ejecutan cuando existe un payload de prueba seguro derivado de evidencia; de lo contrario quedan como **NO_EJECUTABLE**.
          - DELETE continúa protegido para evitar acciones destructivas durante el barrido automático.
          - Mejor correlación de propiedad de objetos mediante aliases de identidad como `user_id`, `account_id`, `cliente_id` y equivalentes.
          - Consolidación runtime de hallazgos únicos manteniendo todos los casos de prueba relacionados.
          - Se conserva la detección real de versiones, runtimes locales/Docker, documentación, cuentas, endpoints, recetas verificables y fallbacks de ejecución.
          - Validación automatizada en Python 3.11 y 3.12, Qt y CustomTkinter.

          ## Descargas

          ### Windows x64
          - `AegisAuditor-Windows-x64-Setup.exe`: instalador recomendado.
          - `AegisAuditor-Windows-x64.exe`: ejecutable portable.

          ### macOS
          - `AegisAuditor-macOS-arm64.dmg`: Apple Silicon.
          - `AegisAuditor-macOS-x64.dmg`: Intel.
          - Los ZIP contienen la aplicación `.app` correspondiente.

          ### Linux
          - `AegisAuditor-Linux-x64.deb`: Debian/Ubuntu x64.
          - `AegisAuditor-Linux-arm64.deb`: Debian/Ubuntu ARM64.
          - `*.tar.gz`: paquetes portables.
          - Binarios directos para x64 y arm64.

          Cada plataforma incluye archivos SHA-256 para verificar integridad.

          ## Licencia

          Aegis Auditor se distribuye bajo Apache License 2.0. Los perfiles de
          aplicaciones analizadas no se incluyen dentro del release.
          EOF

      - name: Publicar GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.zip|*.deb|*.tar.gz|*.sha256|*/AegisAuditor-Linux-x64|*/AegisAuditor-Linux-arm64)
                files+=("$file")
                ;;
            esac
          done < <(find release-assets -type f -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron artefactos para publicar."
            exit 1
          fi

          files+=("LICENSE" "NOTICE")

          if gh release view "v1.2.0" >/dev/null 2>&1; then
            gh release upload "v1.2.0" "${files[@]}" --clobber
            gh release edit "v1.2.0" \
              --title "Aegis Auditor v1.2.0" \
              --notes-file RELEASE_NOTES.md \
              --latest
          else
            gh release create "v1.2.0" "${files[@]}" \
              --target "${GITHUB_SHA}" \
              --title "Aegis Auditor v1.2.0" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi