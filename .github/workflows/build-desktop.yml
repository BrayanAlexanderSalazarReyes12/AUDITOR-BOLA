# security-patching-release: v1.4.2
# release-publish: v1.4.2
# v1.4.2-release-ready: build and publish desktop artifacts after CI/version synchronization
name: Build desktop executables

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "auditor_bola/**"
      - "aegis_auditor.py"
      - "AegisAuditor.spec"
      - "requirements-runtime.txt"
      - "requirements-build.txt"
      - "scripts/generate_app_icons.py"
      - "installer/**"
      - "assets/**"
      - "LICENSE"
      - "NOTICE"
      - ".github/workflows/build-desktop.yml"

jobs:
  windows-x64:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir ejecutable
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Instalar Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Construir instalador
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\AegisAuditor.iss
      - name: Preparar artefactos de release
        shell: pwsh
        run: |
          Copy-Item dist\AegisAuditor.exe dist\AegisAuditor-Windows-x64.exe
          Copy-Item dist\AegisAuditor-Setup.exe dist\AegisAuditor-Windows-x64-Setup.exe
          (Get-FileHash dist\AegisAuditor-Windows-x64.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64.exe.sha256
          (Get-FileHash dist\AegisAuditor-Windows-x64-Setup.exe -Algorithm SHA256).Hash.ToLower() + "  AegisAuditor-Windows-x64-Setup.exe" | Out-File -Encoding ascii dist\AegisAuditor-Windows-x64-Setup.exe.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Windows-x64
          path: |
            dist/AegisAuditor-Windows-x64.exe
            dist/AegisAuditor-Windows-x64-Setup.exe
            dist/AegisAuditor-Windows-x64*.sha256
          if-no-files-found: error

  macos:
    name: macOS ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    env:
      MACOSX_DEPLOYMENT_TARGET: "12.0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir aplicación
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Firma ad-hoc
        run: codesign --force --deep --sign - dist/AegisAuditor.app
      - name: Crear DMG y ZIP
        shell: bash
        run: |
          set -euo pipefail

          rm -rf dmg-root
          mkdir -p dmg-root
          cp -R dist/AegisAuditor.app dmg-root/
          cp LICENSE NOTICE dmg-root/

          dmg="dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg"
          zip="dist/AegisAuditor-macOS-${{ matrix.arch }}.zip"

          # GitHub macOS runners pueden dejar diskimages-helper ocupado unos
          # segundos después del codesign. Limpiamos cualquier montaje previo
          # y reintentamos la creación del DMG en vez de fallar el release por
          # un "Resource busy" transitorio.
          created=0
          for attempt in 1 2 3 4; do
            rm -f "$dmg"
            hdiutil detach "/Volumes/Aegis Auditor" -force >/dev/null 2>&1 || true
            sync
            if hdiutil create               -volname "Aegis Auditor"               -srcfolder dmg-root               -ov               -format UDZO               "$dmg"; then
              created=1
              break
            fi

            echo "hdiutil falló en intento $attempt/4; reintentando..."
            sleep $((attempt * 3))
          done

          if [ "$created" -ne 1 ] || [ ! -s "$dmg" ]; then
            echo "No fue posible crear un DMG válido después de 4 intentos."
            exit 1
          fi

          rm -f "$zip"
          ditto -c -k --sequesterRsrc --keepParent             dist/AegisAuditor.app "$zip"

          shasum -a 256 "$dmg" > "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
          shasum -a 256 "$zip" >> "dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-macOS-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-macOS-${{ matrix.arch }}.dmg
            dist/AegisAuditor-macOS-${{ matrix.arch }}.zip
            dist/AegisAuditor-macOS-${{ matrix.arch }}.sha256
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x64
            deb_arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
            deb_arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - name: Librerías de escritorio
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libx11-6 libxext6 libxrender1 libxft2 libfontconfig1 libegl1 libgl1 libdbus-1-3 libxcb-cursor0 libxkbcommon-x11-0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Dependencias de construcción
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-build.txt
      - name: Generar iconos
        run: python scripts/generate_app_icons.py
      - name: Construir binario
        run: pyinstaller --clean --noconfirm AegisAuditor.spec
      - name: Empaquetar TAR.GZ
        shell: bash
        run: |
          chmod +x dist/AegisAuditor
          mkdir -p package
          cp dist/AegisAuditor package/
          cp docs/REQUISITOS_APLICACION.md package/REQUISITOS.md
          cp LICENSE NOTICE package/
          tar -C package -czf "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" .
      - name: Construir DEB
        shell: bash
        run: |
          root="debroot"
          mkdir -p "$root/DEBIAN" "$root/usr/local/bin" "$root/usr/share/applications" "$root/usr/share/icons/hicolor/256x256/apps" "$root/usr/share/doc/aegis-auditor"
          cp dist/AegisAuditor "$root/usr/local/bin/AegisAuditor"
          cp LICENSE "$root/usr/share/doc/aegis-auditor/LICENSE"
          cp NOTICE "$root/usr/share/doc/aegis-auditor/NOTICE"
          chmod 755 "$root/usr/local/bin/AegisAuditor"
          cp assets/aegis-auditor.png "$root/usr/share/icons/hicolor/256x256/apps/aegis-auditor.png"
          printf '%s\n' \
            '[Desktop Entry]' \
            'Name=Aegis Auditor' \
            'Comment=Security Remediation Studio' \
            'Exec=/usr/local/bin/AegisAuditor' \
            'Icon=aegis-auditor' \
            'Terminal=false' \
            'Type=Application' \
            'Categories=Development;Security;' \
            > "$root/usr/share/applications/aegis-auditor.desktop"
          printf '%s\n' \
            'Package: aegis-auditor' \
            'Version: 1.4.2' \
            'Section: devel' \
            'Priority: optional' \
            'Architecture: ${{ matrix.deb_arch }}' \
            'Maintainer: Aegis Auditor Project' \
            'Depends: libc6, libx11-6, libxext6, libxrender1, libxft2, libfontconfig1, libegl1, libgl1, libdbus-1-3, libxcb-cursor0, libxkbcommon-x11-0' \
            'Description: Aegis Auditor - Security Remediation Studio' \
            ' Auditor correctivo multitecnologia basado en Pilar 1 y Pilar 2.' \
            > "$root/DEBIAN/control"
          dpkg-deb --build "$root" "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb"
      - name: Preparar binario y checksums
        shell: bash
        run: |
          cp "dist/AegisAuditor" "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          chmod +x "dist/AegisAuditor-Linux-${{ matrix.arch }}"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}" > "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
          sha256sum "dist/AegisAuditor-Linux-${{ matrix.arch }}.deb" >> "dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-Auditor-Linux-${{ matrix.arch }}
          path: |
            dist/AegisAuditor-Linux-${{ matrix.arch }}
            dist/AegisAuditor-Linux-${{ matrix.arch }}.tar.gz
            dist/AegisAuditor-Linux-${{ matrix.arch }}.deb
            dist/AegisAuditor-Linux-${{ matrix.arch }}.sha256
          if-no-files-found: error


  release-v1-4-1:
    name: Publicar Release v1.4.2
    needs:
      - windows-x64
      - macos
      - linux
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[release v1.4.2]')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Descargar todos los empaquetados
        uses: actions/download-artifact@v4
        with:
          pattern: Aegis-Auditor-*
          path: release-assets
          merge-multiple: true

      - name: Preparar notas de versión
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'EOF'
          # Aegis Auditor v1.4.2

          Automatización adaptativa de correcciones IA: prueba alternativas, conserva evidencia y cambia de estrategia tras dos fallos consecutivos. La interfaz final muestra el código antes/después con números de línea, diff completo e historial de intentos.

          Versión estable centrada en el ciclo real de corrección de vulnerabilidades y en una vista previa de código legible antes de aplicar una medicina:
          **detectar → parchear código real → reiniciar → reescanear → verificar → guardar medicina**.

          ## Corrección y parchado

          - Aegis identifica automáticamente el lenguaje y señales de framework del archivo cargado antes de generar una medicina.
          - La IA recibe ese lenguaje como restricción: Python recibe Python válido, Java recibe Java, JavaScript recibe JavaScript y así sucesivamente.
          - Las recetas pueden modificar uno o varios archivos cuando la causa raíz atraviesa varias capas.
          - Los planes multiarchivo se validan y aplican de forma transaccional con backup y rollback.
          - Antes de aplicar una receta, la interfaz muestra el cambio calculado sobre el código real: líneas anteriores en rojo y líneas nuevas en verde.
          - Las propuestas no aplicables permanecen visibles para diagnóstico, pero no se pueden ejecutar.
          - El archivo se protege por SHA-256 para impedir aplicar un parche generado sobre una versión diferente.

          ## Verificación de seguridad

          - El orden correcto es: aplicar parche → validar sintaxis/build → reiniciar o recargar servicio → reejecutar el control de seguridad.
          - El parche solo se considera verificado cuando el bug o fallo de seguridad original deja de ser reproducible.
          - La suite funcional general se ejecuta después del reescaneo de seguridad.
          - Si la vulnerabilidad ya quedó cerrada pero una prueba antigua todavía espera el comportamiento vulnerable, Aegis conserva el parche como PATCH_VERIFIED_WITH_WARNINGS en lugar de restaurar el bug.
          - Si el parche no elimina el hallazgo, falla sintaxis/build o introduce una regresión del control, Aegis ejecuta rollback y conserva evidencia.

          ## Medicina y aprendizaje

          - Todo parche verificado se guarda en la biblioteca de recetas, tanto PATCH_VERIFIED como PATCH_VERIFIED_WITH_WARNINGS.
          - La biblioteca de recetas usa schema v2 y conserva planes multiarchivo verificados.
          - El conocimiento semántico se guarda únicamente después de verificar dinámicamente la corrección.
          - Las medicinas fallidas no se promueven como soluciones verificadas.
          - Aegis conserva diagnóstico, intento y evidencia para evitar repetir estrategias que ya fallaron.

          ## Auditoría P1 + P2

          - Matriz endpoint × identidad y promoción de filas vulnerables a hallazgos reales.
          - Pilar 2 generalizado por familias, causa raíz, evidencia y deduplicación semántica.
          - IDs estables, hallazgos consolidados y separación entre caso de prueba y vulnerabilidad.
          - Pruebas automáticas preferentemente no destructivas y payloads derivados de evidencia.

          ## Descargas

          ### Windows x64
          - `AegisAuditor-Windows-x64-Setup.exe`: instalador recomendado.
          - `AegisAuditor-Windows-x64.exe`: ejecutable portable.

          ### macOS
          - `AegisAuditor-macOS-arm64.dmg`: Apple Silicon.
          - `AegisAuditor-macOS-x64.dmg`: Intel.
          - Los ZIP contienen la aplicación correspondiente.

          ### Linux
          - Paquetes DEB para x64 y ARM64.
          - TAR.GZ y binarios directos para ambas arquitecturas.

          Cada plataforma incluye checksums SHA-256.

          ## Licencia

          Apache License 2.0. Los perfiles de aplicaciones analizadas y las
          credenciales del usuario no forman parte del release.
          EOF

      - name: Publicar Release v1.4.2
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          files=()
          while IFS= read -r -d '' file; do
            case "$file" in
              *.exe|*.dmg|*.zip|*.deb|*.tar.gz|*.sha256|*/AegisAuditor-Linux-x64|*/AegisAuditor-Linux-arm64)
                files+=("$file")
                ;;
            esac
          done < <(find release-assets -type f -print0)

          if [ "${#files[@]}" -eq 0 ]; then
            echo "No se encontraron artefactos para publicar."
            exit 1
          fi

          files+=("LICENSE" "NOTICE")

          gh release create "v1.4.2" "${files[@]}" \
            --target "${GITHUB_SHA}" \
            --title "Aegis Auditor v1.4.2" \
            --notes-file RELEASE_NOTES.md
